version: '3.8'

services:
  
  postgres:
    image: postgres:15
    container_name: lakehouse_postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: lakehouse_user
      POSTGRES_PASSWORD: lakehouse_password
      POSTGRES_DB: ecommerce_dw
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: